name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate workflow pinning
        run: python3 scripts/validate-workflows.py
      - name: Test workflow validator
        run: python3 scripts/test-validate-workflows.py
      - name: List skills
        run: scripts/list-skills.sh | grep -q "skills/filament/filament-plugin-first/SKILL.md"
      - name: Validate entrypoint sync
        run: diff -u <(sed '3d' AGENTS.md) <(sed '3d' CLAUDE.md)
      - name: Validate plugin paths
        run: python3 scripts/validate-plugin.py
      - name: Test plugin validator
        run: python3 scripts/test-validate-plugin.py
      - name: Run filament-plugin-first deterministic outcome contract
        run: bash eval/filament/filament-plugin-first/run-eval.sh --dry-run
      - name: Run laravel-conventions deterministic outcome contract
        run: bash eval/laravel/laravel-conventions/run-eval.sh --dry-run
      - name: Run livewire-conventions deterministic outcome contract
        run: bash eval/filament/livewire-conventions/run-eval.sh --dry-run
      - name: Run laravel-testing deterministic outcome contract
        run: bash eval/laravel/laravel-testing/run-eval.sh --dry-run
      - name: Run php-principles deterministic outcome contract
        run: bash eval/php/php-principles/run-eval.sh --dry-run
      - name: Run laravel-security deterministic outcome contract
        run: bash eval/laravel/laravel-security/run-eval.sh --dry-run
      - name: Validate sources ledger
        run: python3 scripts/validate-sources.py
      - name: Run filament-conventions deterministic outcome contract
        run: bash eval/filament/filament-conventions/run-eval.sh --dry-run
